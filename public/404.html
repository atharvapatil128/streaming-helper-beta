<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Streaming Helper</title>
    <meta name="description" content="The requested Streaming Helper page could not be found." />
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #f4f2f7; background: radial-gradient(circle at 50% 110%, #251c50 0, #08080e 48%); text-align: center; }
      main { max-width: 760px; }
      img { width: 54px; height: 54px; border-radius: 14px; }
      p { margin-top: 26px; color: #9a87ff; font-size: 12px; font-weight: 800; letter-spacing: .15em; }
      h1 { margin: 12px 0 18px; font-size: clamp(42px, 8vw, 76px); line-height: .98; letter-spacing: -.055em; }
      span { display: block; color: #aaa6b9; font-size: 18px; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
      a { min-height: 48px; padding: 0 20px; display: inline-flex; align-items: center; border: 1px solid #31313d; border-radius: 12px; color: #fff; background: #15151e; text-decoration: none; font-weight: 750; }
      a:first-child { background: #5948a4; border-color: #7563c8; }
    </style>
  </head>
  <body>
    <main>
      <img src="/helper-active.svg" alt="" />
      <p>404 | PAGE NOT FOUND</p>
      <h1>This recommendation went missing.</h1>
      <span>The page may have moved, or the address may be incomplete.</span>
      <nav aria-label="404 navigation"><a href="/">Back home</a><a href="/help">Visit Help</a></nav>
    </main>
  </body>
</html>
