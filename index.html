
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      />
      <title>Streaming Helper | Share show recommendations with friends</title>
      <meta name="description" content="Send show and movie recommendations while you stream, keep trusted picks organized, and find something to watch without losing recommendations in chat." />
      <meta name="robots" content="index, follow" />
      <link rel="canonical" href="https://streaminghelper.net/" />
      <meta property="og:type" content="website" />
      <meta property="og:title" content="Streaming Helper | Share show recommendations with friends" />
      <meta property="og:description" content="Send show and movie recommendations while you stream, keep trusted picks organized, and find something to watch without losing recommendations in chat." />
      <meta property="og:url" content="https://streaminghelper.net/" />
      <meta property="og:image" content="https://streaminghelper.net/streaming-helper-social.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Streaming Helper passes a show recommendation from a watch screen to a saved recommendation card" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Streaming Helper | Share show recommendations with friends" />
      <meta name="twitter:description" content="Send show and movie recommendations while you stream, keep trusted picks organized, and find something to watch without losing recommendations in chat." />
      <meta name="twitter:image" content="https://streaminghelper.net/streaming-helper-social.png" />
      <meta name="theme-color" content="#08080e" />
      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "Streaming Helper",
          "applicationCategory": "EntertainmentApplication",
          "operatingSystem": "Chrome",
          "url": "https://streaminghelper.net/",
          "description": "A companion web app and Chrome extension for friend recommendations and comfort picks while you stream.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      </script>
      <style>
        html, body { min-height: 100%; margin: 0; background: #08080e; }
        #root { min-height: 100%; }
        .site-preloader {
          position: fixed;
          z-index: 9999;
          inset: 0;
          display: grid;
          place-items: center;
          color: #f4f1f8;
          background:
            radial-gradient(circle at 68% 24%, rgba(99, 82, 196, 0.14), transparent 28rem),
            #08080e;
          opacity: 1;
          visibility: visible;
          transition: opacity 220ms ease, visibility 220ms ease;
        }
        .site-preloader.is-ready {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
        .site-preloader__content {
          width: min(320px, calc(100vw - 48px));
          display: grid;
          justify-items: center;
          gap: 22px;
        }
        .site-preloader__brand {
          display: flex;
          align-items: center;
          gap: 12px;
          font: 750 18px/1.2 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          letter-spacing: -0.02em;
        }
        .site-preloader__brand img {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }
        .site-preloader__track {
          width: 176px;
          height: 3px;
          overflow: hidden;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
        }
        .site-preloader__track::after {
          content: "";
          display: block;
          width: 42%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, #9a63f3, #759dff);
          animation: site-preloader-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        @keyframes site-preloader-progress {
          from { transform: translateX(-16%); }
          to { transform: translateX(154%); }
        }
        @media (prefers-reduced-motion: reduce) {
          .site-preloader { transition-duration: 1ms; }
          .site-preloader__track::after { animation: none; transform: translateX(70%); }
        }
      </style>
      
    </head>

    <body>
      <div id="site-preloader" class="site-preloader" role="status" aria-label="Loading Streaming Helper">
        <div class="site-preloader__content" aria-hidden="true">
          <div class="site-preloader__brand">
            <img src="/apple-touch-icon.png" alt="" width="42" height="42" />
            <span>Streaming Helper</span>
          </div>
          <div class="site-preloader__track"></div>
        </div>
      </div>
      <noscript><style>.site-preloader { display: none; }</style></noscript>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
